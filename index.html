<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#050806" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Empresa de Ciberseguridad y Pentesting AlcaNox</title>
    <script>
      (function () {
        var supported = /^(es|en)(?:-|$)/i;
        var normalize = function (value) {
          var match = String(value || "").match(supported);
          return match ? match[1].toLowerCase() : "";
        };
        var cookieMatch = document.cookie.match(/(?:^|;\s*)alcanox_language=(es|en)(?:;|$)/i);
        var saved = cookieMatch ? normalize(cookieMatch[1]) : "";

        if (!saved) {
          try {
            saved = normalize(window.localStorage.getItem("alcanox_language"));
          } catch (error) {
          }
        }

        var primaryLanguage = navigator.languages && navigator.languages.length
          ? navigator.languages[0]
          : navigator.language;
        var detected = /^es(?:-|$)/i.test(primaryLanguage || "") ? "es" : "en";
        var destination = saved || detected;
        window.location.replace("/" + destination + "/" + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <main>
      <p>Cargando AlcaNox… / Loading AlcaNox…</p>
      <p><a href="/es/" lang="es">Español</a> · <a href="/en/" lang="en">English</a></p>
    </main>
  </body>
</html>
